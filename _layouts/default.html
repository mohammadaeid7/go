<!-- HTML output will be minified by jekyll-minifier gem -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

    {%- comment -%} Example webfont preload hook {%- endcomment -%}
    {% if site.google_fonts %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family={{ site.google_fonts | uri_escape }}&display=swap" rel="stylesheet" />
    {% endif %}
  </head>
  <body>
    {{ content }}

    <script defer src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
