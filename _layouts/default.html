<!-- HTML output will be minified by jekyll-minifier gem -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <!-- Inline light-weight critical CSS for first paint -->
    <style>
      /* Critical CSS: keep this extremely small */
      body{margin:0;padding:0 1rem;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    </style>

    {%- assign v = site.time | date: '%s' -%}
    <!-- Preload full stylesheet; it will apply when loaded -->
    <link rel="preload" as="style" href="{{ '/assets/css/main.css' | relative_url }}?v={{ v }}" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ v }}" /></noscript>

    {%- comment -%} Example webfont preload hook {%- endcomment -%}
    {% if site.google_fonts %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family={{ site.google_fonts | uri_escape }}&display=swap" rel="stylesheet" />
    {% endif %}
  </head>
  <body>
    {{ content }}

    <script defer src="{{ '/assets/js/main.js' | relative_url }}?v={{ v }}"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}');
        });
      }
    </script>
  </body>
</html>
