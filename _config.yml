title: Open Source Data Science Masters
baseurl: "" # Deploy site at root

# Enable additional functionality
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-minifier
  - jekyll-include-cache

# Exclude development and build artifacts
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: [development]