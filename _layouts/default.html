<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Performance and SEO meta tags -->
    {% seo %}
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
    
    <!-- Performance hints -->
    <meta name="theme-color" content="#2563eb">
    <meta name="color-scheme" content="light dark">
    
    <!-- Cache control -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000">
    
    <style>
        /* Critical CSS for above-the-fold content */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: #2563eb;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        
        h1 { font-size: 2.5rem; }
        h2 { font-size: 2rem; }
        h3 { font-size: 1.5rem; }
        
        a {
            color: #2563eb;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        blockquote {
            border-left: 4px solid #2563eb;
            margin: 1.5rem 0;
            padding-left: 1rem;
            color: #666;
        }
        
        code {
            background: #f8f9fa;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
        }
        
        pre {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
        }
        
        ul, ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }
        
        li {
            margin: 0.5rem 0;
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0f172a;
                color: #e2e8f0;
            }
            
            h1, h2, h3, h4, h5, h6 {
                color: #60a5fa;
            }
            
            a {
                color: #60a5fa;
            }
            
            blockquote {
                border-left-color: #60a5fa;
                color: #94a3b8;
            }
            
            code, pre {
                background: #1e293b;
                color: #e2e8f0;
            }
        }
        
        /* Performance optimizations */
        img {
            max-width: 100%;
            height: auto;
            loading: lazy;
        }
        
        /* Reduce layout shift */
        .content {
            min-height: 60vh;
        }
    </style>
</head>
<body>
    <div class="content">
        {{ content }}
    </div>
    
    <!-- Performance monitoring -->
    <script>
        // Lazy load non-critical resources
        window.addEventListener('load', function() {
            // Performance monitoring
            if ('performance' in window) {
                var loadTime = window.performance.timing.loadEventEnd - window.performance.timing.navigationStart;
                console.log('Page load time:', loadTime + 'ms');
            }
        });
    </script>
</body>
</html>
